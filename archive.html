---
layout: page
title: Archive
permalink: /archive/
---

<input type="text" id="search" placeholder="Find some articles here" />

{% for post in site.posts %}
  {% assign currentDate = post.date | date: "%Y" %}
  {% if currentDate != previousDate %}
    <h2>{{ currentDate }}</h2>
    {% assign previousDate = currentDate %}
  {% endif %}

  <article>
    <a class="archive-post" href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </article>
{% endfor %}

<script>
  const searchInput = document.getElementById('search');
  const posts = document.querySelectorAll('article');

  searchInput.addEventListener('input', () => {
    const query = searchInput.value.trim().toLowerCase();

    posts.forEach(post => {
      post.hidden = !post.textContent.toLowerCase().includes(query);
    });
  });
</script>
